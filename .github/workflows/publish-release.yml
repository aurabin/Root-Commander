name: Publish RootCommander Virtual Field APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
      - "app/**"
      - "tests/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.5.0-build-${GITHUB_SHA:0:7}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SUM="app/build/outputs/apk/debug/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it immutable."
          else
            gh release create "$TAG" "$APK#RootCommander-1.5-debug.apk" "$SUM" \
              --title "RootCommander 1.5 Virtual Field (Debug) · ${GITHUB_SHA:0:7}" \
              --notes "Android 7.0+ debug APK. Virtual Field launcher, unbounded file listing with 60-entry display batches, multilingual help. Automated build and tests; not device-tested. No automatic root access. Each release is tied to a unique commit." \
              --prerelease --target "${GITHUB_SHA}"
          fi
